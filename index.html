<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Rellotge per a partides de Scrabble amb validador de paraules">
  <meta name="author" content="Antoni Llull">
  <meta name="theme-color" content="#000000">

  <link rel="apple-touch-icon" sizes="57x57"   href="images/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60"   href="images/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72"   href="images/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76"   href="images/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="images/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="images/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="images/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="images/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32"   href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96"   href="images/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16"   href="images/favicon-16x16.png">
  <link rel="manifest" href="rellotge.webmanifest">

  <link rel="stylesheet" href="css/style.css">

  <script src="wdtjs/jquery.js"></script>
  <script src="wdtjs/general.js"></script>
  <script src="wdtjs/bits.js"></script>
  <script src="dicc/disc.js"></script>
  <script src="js/nosleep.min.js"></script>

  <title>Rellotge Scrabble</title>
</head>

<body onselectstart="return false">

  <noscript>
    <p style="color:#FC0000;text-align:center">Activa el javascript per utilitzar l'aplicació</p>
  </noscript>

  <!-- ══ Joc principal ══════════════════════════════════════════════════════ -->
  <main id="joc" hidden>

    <div class="player">

      <div class="player__tile player-1">
        <div class="player__digits">
          <span id="min1">30</span>:<span id="sec1">00</span>
          <div id="penal1"></div>
          <div class="nom" id="nom1"></div>
        </div>
      </div>

      <div class="timer__buttons">
        <button class="timer__start-bttn bttn" type="button">COMENÇA</button>
        <button id="btn-valida" class="btn-valida bttn" type="button" hidden>
          Comprova la jugada
        </button>
      </div>

      <div class="player__tile player-2">
        <div class="player__digits">
          <span id="min2">30</span>:<span id="sec2">00</span>
          <div id="penal2"></div>
          <div class="nom" id="nom2"></div>
        </div>
      </div>

    </div>

    <button id="btn-ajust"      class="btn-corner btn-corner--right"
            type="button" aria-label="Ajustaments">☰</button>
    <button id="btn-fullscreen" class="btn-corner btn-corner--left"
            type="button" aria-label="Pantalla completa" hidden>⛶</button>

  </main>


  <!-- ══ Modal: Configuració ════════════════════════════════════════════════ -->
  <div id="modal-ajust" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="title-ajust">

    <div class="modal__panel">
      <div class="modal__header">
        <span class="modal__title" id="title-ajust">Rellotge Scrabble</span>
        <button class="modal__close" id="close-ajust" type="button"
                aria-label="Tanca">✕</button>
      </div>

      <div class="modal__body">
        <form id="parametres">

          <label class="field-label">
            <span>Minuts de joc</span>
            <input type="number" id="temps" value="25" min="1" max="99">
          </label>

          <label class="field-label">
            <span>Minuts extra amb penalització</span>
            <input type="number" id="penalització" value="5" min="1" max="30">
          </label>

          <label class="field-label">
            <span>Jugador 1</span>
            <input type="text" id="nomjug1" value="" autocomplete="off"
                   spellcheck="false" placeholder="Nom opcional">
          </label>

          <label class="field-label">
            <span>Jugador 2</span>
            <input type="text" id="nomjug2" value="" autocomplete="off"
                   spellcheck="false" placeholder="Nom opcional">
          </label>

          <div class="field-checks">
            <label class="field-check">
              <input type="checkbox" id="checkSo" checked>
              <span>So</span>
            </label>
            <label class="field-check">
              <input type="checkbox" id="checkVibracio" checked>
              <span>Vibració</span>
            </label>
            <label class="field-check">
              <input type="checkbox" id="checkFullScreen">
              <span>Pantalla completa</span>
            </label>
          </div>

          <div class="modal__actions">
            <button id="tempsBtn"  class="btn-primary bttn"   type="button">Nova partida</button>
            <button id="resetBtn"  class="btn-secondary bttn" type="button" hidden>Continua la partida</button>
          </div>

        </form>

        <footer>
          <div><small>Fet per <a href="mailto:tonillull@gmail.com" target="_blank">Antoni Llull</a> ❤</small></div>
          <div><small>Validador: <a href="https://icon.cat/wordertorn/" target="_blank">WORdERtorn</a></small></div>
          <div><small>Diccionari DISC <a href="http://diccionari.totescrable.cat/" target="_blank"><span class="verdicc"></span></a></small></div>
          <div><small><a href="https://github.com/manacup/manacup.github.io/tree/main/rellotgeScrabble" target="_blank">Codi font (GitHub)</a></small></div>
          <div><small><span id="swver"></span></small></div>
        </footer>
      </div>
    </div>

  </div>


  <!-- ══ Modal: Validador de paraules ══════════════════════════════════════ -->
  <div id="modal-valid" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="title-valid" hidden>

    <div class="modal__panel">
      <div class="modal__header">
        <span class="modal__title" id="title-valid">Comprova la jugada</span>
        <button class="modal__close" id="close-valid" type="button"
                aria-label="Tanca">✕</button>
      </div>

      <div class="modal__body">

        <div id="req">
          <form id="wdtform" name="wdtform" action="wordertorn">
            <div id="input">
              <input type="text" class="qry" name="q"
                     placeholder="Escriviu un o més mots"
                     autocomplete="off"
                     autocorrect="off"
                     autocapitalize="off"
                     spellcheck="false"
                     value="">
            </div>
            <div id="buttons">
              <input class="sch btn" name="sch" type="button" value="valida">
            </div>
          </form>
        </div>

        <div id="res">
          <div id="res_info"></div>
          <div id="res_timer"></div>
        </div>

        <div id="copy">
          <p><small>
            Motor VISC: <a href="mailto:iroca@icon.cat">Isaac Roca</a> ·
            Diccionari DISC <a href="http://diccionari.totescrable.cat/que-es/"
            target="_blank"><span class="verdicc"></span></a>
          </small></p>
        </div>

      </div>
    </div>

  </div>

  <iframe name="estadistica" id="estadistica" src="" style="display:none"></iframe>

  <script src="js/script.js"></script>

</body>
</html>
